repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.claude/
  - repo: local
    hooks:
      - id: examples-check
        name: shell syntax, Python syntax, and the TypeScript types and build
        entry: mise run check
        language: system
        pass_filenames: false
