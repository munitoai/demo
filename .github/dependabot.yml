version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/document-ai/ocr/typescript"
      - "/inference/chat/typescript"
      - "/sandboxes/code-interpreter/typescript"
      - "/sandboxes/dev-preview/typescript"
      - "/sandboxes/fan-out/typescript"
      - "/sandboxes/quickstart/typescript"
      - "/demos/place/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
